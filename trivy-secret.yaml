# Trivy secret scanning for the container image (.github/workflows/ci.yml, TRIVY_SECRET_CONFIG).
# Vulnerability scanning is not affected by this file.
allow-rules:
  - id: third-party-site-packages
    # Installed third-party packages are not our code. The Anthropic SDK, for example, documents the
    # literal {"type": "service_account"} in docstrings, which matches the gcp-service-account rule
    # (first CI run). Our own source is still scanned here, and gitleaks scans the whole git history.
    description: Example strings in docstrings of installed third-party Python packages
    path: .*/site-packages/.*
