# SentinelOps demo / single-host stack.
#   cp .env.example .env
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
#   open http://localhost:8080   (demo mode: demo accounts on the login page)
# Optional OIDC with Keycloak: add `--profile oidc` and set the OIDC variables in .env (see .env.example).
name: sentinelops

x-app: &app
  image: ${SENTINELOPS_IMAGE:-sentinelops:local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  read_only: true
  tmpfs:
    - /tmp:size=1g
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  environment: &env
    SENTINELOPS_DATABASE_URL: postgresql+asyncpg://sentinelops:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/sentinelops
    SENTINELOPS_DEMO_MODE: ${SENTINELOPS_DEMO_MODE:-true}
    SENTINELOPS_DEMO_NOW: ${SENTINELOPS_DEMO_NOW:-2026-03-12T10:30:00+01:00}
    SENTINELOPS_DISPLAY_TZ: ${SENTINELOPS_DISPLAY_TZ:-Europe/Berlin}
    SENTINELOPS_APPROVAL_SECRET: ${SENTINELOPS_APPROVAL_SECRET:?set SENTINELOPS_APPROVAL_SECRET in .env}
    SENTINELOPS_FOUR_EYES: ${SENTINELOPS_FOUR_EYES:-true}
    SENTINELOPS_OIDC_ISSUER: ${SENTINELOPS_OIDC_ISSUER:-}
    SENTINELOPS_OIDC_JWKS_URL: ${SENTINELOPS_OIDC_JWKS_URL:-}
    SENTINELOPS_OIDC_AUDIENCE: ${SENTINELOPS_OIDC_AUDIENCE:-sentinelops}
    SENTINELOPS_OIDC_CLIENT_ID: ${SENTINELOPS_OIDC_CLIENT_ID:-sentinelops-web}
    SENTINELOPS_LLM_PROVIDER: ${SENTINELOPS_LLM_PROVIDER:-mock}
    SENTINELOPS_LLM_BASE_URL: ${SENTINELOPS_LLM_BASE_URL:-}
    SENTINELOPS_LLM_MODEL: ${SENTINELOPS_LLM_MODEL:-}
    SENTINELOPS_LLM_API_KEY: ${SENTINELOPS_LLM_API_KEY:-}
    SENTINELOPS_LLM_CLOUD_OPT_IN: ${SENTINELOPS_LLM_CLOUD_OPT_IN:-false}
    SENTINELOPS_RETENTION_EVENTS_DAYS: ${SENTINELOPS_RETENTION_EVENTS_DAYS:-90}

services:
  db:
    image: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    environment:
      POSTGRES_USER: sentinelops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sentinelops
    volumes:
      - pgdata:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelops -d sentinelops"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: migrations, then (demo mode) generate and load the Musterfirma demo data.
  init:
    <<: *app
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - sentinelops migrate && if [ "$${SENTINELOPS_DEMO_MODE}" = "true" ]; then sentinelops demo-load --out /data/demo; fi
    volumes:
      - demo-data:/data
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "${SENTINELOPS_PORT:-8080}:8080"
    depends_on:
      init:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *env
      SENTINELOPS_DROP_FOLDER: /drop
      SENTINELOPS_SYSLOG_PORT: ${SENTINELOPS_SYSLOG_PORT:-}
    volumes:
      - drop:/drop
    # Optional syslog receiver: set SENTINELOPS_SYSLOG_PORT=5514 in .env and publish the port:
    # ports: ["5514:5514/udp", "5514:5514/tcp"]
    healthcheck:
      disable: true
    depends_on:
      init:
        condition: service_completed_successfully

  keycloak:
    profiles: ["oidc"]
    image: quay.io/keycloak/keycloak:26.7.5@sha256:37dbaf6f0722c9ec246335f36e1ef8b2e6cb960f7c27e0d8c615121a3d475a85
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-sentinelops.json:/opt/keycloak/data/import/realm-sentinelops.json:ro
    ports:
      - "8081:8080"
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  pgdata:
  demo-data:
  drop:
