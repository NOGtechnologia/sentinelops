[project]
name = "musterfirma-generator"
version = "1.0.0"
description = "Deterministic test data generator for SentinelOps (fictitious Musterfirma GmbH)"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.14.1", "tzdata>=2026.5"]

[project.scripts]
musterfirma-gen = "musterfirma.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musterfirma"]
