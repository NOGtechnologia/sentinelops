name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.1"
  PNPM_VERSION: "10.34.7"
  NODE_VERSION: "24"

jobs:
  playwright:
    name: Playwright (Chromium, Firefox, WebKit), axe, XSS, Lighthouse, ZAP
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
        env:
          POSTGRES_USER: sentinelops
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinelops"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SENTINELOPS_E2E_ADMIN_URL: postgresql+asyncpg://sentinelops:ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: uv sync --frozen --all-packages
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Start one demo instance per browser (fresh database, seed dev, fixed clock)
        # Acceptance tests change data, so every browser gets its own database (see e2e/playwright.config.ts).
        run: |
          port=8001
          for browser in chromium firefox webkit; do
            E2E_PORT=$port SENTINELOPS_E2E_DB="sentinelops_e2e_${browser}" E2E_DATASET=".cache/e2e-dataset-${browser}" \
              uv run --directory backend python ../scripts/e2e_server.py > "${RUNNER_TEMP}/server-${browser}.log" 2>&1 &
            port=$((port + 1))
          done
          for port in 8001 8002 8003; do
            for i in $(seq 1 180); do curl -fsS "http://127.0.0.1:${port}/api/v1/health" && break; sleep 5; done
            curl -fsS "http://127.0.0.1:${port}/api/v1/health" > /dev/null
          done
      - name: Playwright (acceptance A4/A7, XSS, accessibility, core flows, visual regression)
        env:
          E2E_BASE_URL_CHROMIUM: http://127.0.0.1:8001
          E2E_BASE_URL_FIREFOX: http://127.0.0.1:8002
          E2E_BASE_URL_WEBKIT: http://127.0.0.1:8003
          CI: "true"
        run: pnpm e2e
      - name: Lighthouse (performance >= 90, accessibility >= 95, best practices >= 95)
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: http://127.0.0.1:8001/
          configPath: .github/lighthouserc.json
          uploadArtifacts: true
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:8001
          rules_file_name: .github/zap-rules.tsv
          fail_action: true
          allow_issue_writing: false
          cmd_options: "-a"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results
          path: |
            .cache/e2e-results
            .cache/e2e-report
            ${{ runner.temp }}/server-*.log

  compose:
    name: fresh clone + docker compose up (demo)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the demo stack exactly as documented in the README
        run: |
          cp .env.example .env
          docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
          for i in $(seq 1 120); do curl -fsS http://localhost:8080/api/v1/health && break; sleep 10; done
          curl -fsS http://localhost:8080/api/v1/auth/config | grep -q '"demo_mode":true'
          token=$(curl -fsS -X POST -H 'Content-Type: application/json' -d '{"user":"analyst"}' http://localhost:8080/api/v1/auth/demo-login | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          cases=$(curl -fsS -H "Authorization: Bearer ${token}" http://localhost:8080/api/v1/cases | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')
          echo "cases: ${cases}"
          test "${cases}" -eq 10
      - name: Logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file .env logs --no-color | tail -n 200
