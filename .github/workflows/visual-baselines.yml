name: Visual baselines

# Renders the Playwright visual-regression baselines on Linux (the CI platform) and opens a pull
# request with them. Run manually after UI changes that are intended.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  baselines:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
        env:
          POSTGRES_USER: sentinelops
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinelops"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SENTINELOPS_E2E_ADMIN_URL: postgresql+asyncpg://sentinelops:ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.34.7"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: uv sync --frozen --all-packages && pnpm install --frozen-lockfile && pnpm --dir frontend build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:update-snapshots
      - name: Pull request with the new baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/visual-baselines-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add e2e/__screenshots__
          git commit -m "test(e2e): update visual regression baselines" || exit 0
          git push origin "$branch"
          gh pr create --title "test(e2e): update visual regression baselines" --body "Rendered by the visual-baselines workflow on Linux." --base main --head "$branch"
