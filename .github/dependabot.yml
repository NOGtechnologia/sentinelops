version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      python:
        patterns: ["*"]
    labels: [dependencies, backend]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      web:
        patterns: ["*"]
    labels: [dependencies, frontend]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly, day: monday }
    labels: [dependencies]
