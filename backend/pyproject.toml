[project]
name = "sentinelops"
version = "1.0.1"
description = "Erklärbares, KI-gestütztes Security-Operations-Werkzeug: von 50.000 Log-Zeilen zum untersuchbaren Fall"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "asyncpg>=0.32.0",
    "defusedxml>=0.7.1",
    "evtx>=0.13.1",
    "fastapi>=0.146.0",
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "pysigma>=2.0.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.5",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
sentinelops = "sentinelops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelops"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "DTZ", "PL", "PT", "N", "C4", "PERF"]
ignore = [
    # Mapping tables, parsers and the pure analysis functions have many
    # branches/arguments by nature; their behaviour is pinned by tests and
    # 100 % branch coverage on the core modules instead.
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and fixed example values by design; long literal test vectors
# and plain-text `match=` messages are intentional.
"tests/**" = ["S101", "S105", "S106", "S311", "PLR2004", "PLC0415", "DTZ001", "E501", "RUF043"]
# Verbatim example log lines must not be wrapped (they are test vectors).
"src/sentinelops/parsers/linux_auth.py" = ["E501"]
# The CLI imports subcommand dependencies lazily to keep start-up fast.
"src/sentinelops/cli.py" = ["PLC0415"]
# German typography (en dash) in generated documentation text.
"src/sentinelops/detection/catalog_doc.py" = ["RUF001"]
"../generator/src/musterfirma/quality.py" = ["E501"]
"../generator/src/musterfirma/writers.py" = ["E501"]
"../generator/src/musterfirma/events.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["sentinelops"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages without type information (verified in Phase 0).
module = ["evtx", "evtx.*", "defusedxml.*", "fpdf.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: needs PostgreSQL (SENTINELOPS_TEST_DATABASE_URL or Testcontainers)",
    "benchmark: detection benchmark on generated data",
    "acceptance: acceptance tests A1-A8",
    "slow: long running",
]

[tool.importlinter]
root_package = "sentinelops"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain logic is free of I/O (spec 13)"
type = "forbidden"
source_modules = [
    "sentinelops.normalize",
    "sentinelops.detection.matcher",
    "sentinelops.detection.correlation",
    "sentinelops.correlation",
    "sentinelops.ai.validator",
    "sentinelops.reports.render",
    "sentinelops.reports.pseudonymize",
]
forbidden_modules = [
    "sqlalchemy",
    "asyncpg",
    "httpx",
    "fastapi",
    "starlette",
    "sentinelops.storage",
    "sentinelops.api",
    "sentinelops.worker",
    "sentinelops.ingest.runs",
]

[[tool.importlinter.contracts]]
name = "The API does not use parsers directly"
type = "forbidden"
source_modules = ["sentinelops.api"]
forbidden_modules = ["sentinelops.parsers"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The AI cannot reach response actions"
type = "forbidden"
source_modules = ["sentinelops.ai"]
forbidden_modules = ["sentinelops.response"]

# Mutation testing (nightly, Linux): score >= 85 % on the core logic (spec 15.2), checked by
# scripts/check_mutation.py from mutants/mutmut-cicd-stats.json.
[tool.mutmut]
paths_to_mutate = [
    "src/sentinelops/normalize/",
    "src/sentinelops/detection/matcher.py",
    "src/sentinelops/detection/correlation.py",
    "src/sentinelops/correlation/",
    "src/sentinelops/ai/validator.py",
    "src/sentinelops/response/approvals.py",
]
tests_dir = ["tests/unit/", "tests/property/"]
# Rules are read via SENTINELOPS_RULES_DIR (absolute) in the nightly job.
also_copy = ["tests/"]

[tool.coverage.run]
branch = true
source = ["sentinelops"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$", "raise NotImplementedError"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.1",
    "import-linter>=2.15",
    "mkdocs<2",
    "mkdocs-material>=9.7.7",
    "mutmut>=3.8.0",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pypdf>=6.21.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "schemathesis>=4.32.0",
    "testcontainers>=4.15.0",
    "types-pyyaml>=6.0.12.20260906",
]
