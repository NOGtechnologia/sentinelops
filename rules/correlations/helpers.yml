# Helper base rules referenced by the correlation rules. They carry no
# `sentinelops.rule_id` and therefore never raise alerts on their own.
title: Failed logon (helper)
id: 2b235a44-0aae-51ad-a419-02c0cf332118
name: so_helper_logon_failed
status: stable
description: Failed interactive, network or SSH logon of a named account (machine accounts excluded).
author: SentinelOps
date: 2026-10-18
logsource:
  product: sentinelops
  category: authentication
detection:
  selection:
    event.action: logon-failed
  filter_machine_account:
    user.name|endswith: '$'
  condition: selection and not filter_machine_account
level: informational
---
title: Successful logon (helper)
id: ca4765aa-4268-5e0a-a01e-158741c32884
name: so_helper_logon_success
status: stable
description: Successful logon of a named account.
author: SentinelOps
date: 2026-10-18
logsource:
  product: sentinelops
  category: authentication
detection:
  selection:
    event.action: logon
    event.outcome: success
  filter_machine_account:
    user.name|endswith: '$'
  condition: selection and not filter_machine_account
level: informational
---
title: Network logon (helper)
id: 77cdd511-b54c-5334-98f3-a7b5d9bd509c
name: so_helper_network_logon
status: stable
description: Successful Windows network logon (logon type 3) of a named account.
author: SentinelOps
date: 2026-10-18
logsource:
  product: sentinelops
  category: authentication
detection:
  selection:
    event.action: logon
    event.outcome: success
    logon.type: 3
  filter_machine_account:
    user.name|endswith: '$'
  filter_anonymous:
    user.name: 'ANONYMOUS LOGON'
  condition: selection and not 1 of filter_*
level: informational
