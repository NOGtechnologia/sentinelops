title: Linux privilege escalation failure (helper)
id: 81105914-1d67-5505-80c6-45c772510423
name: so_helper_linux_privesc_failure
status: stable
description: Failed sudo (wrong password, not in sudoers) or failed su.
author: SentinelOps
date: 2026-10-18
logsource:
  product: sentinelops
  category: process
detection:
  selection:
    event.action:
      - sudo-failed
      - sudo-denied
      - su-failed
  condition: selection
level: informational
